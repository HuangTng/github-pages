<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        a {
            color: #007BFF;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>欢迎来到我的网页！</h1>
    <p>这是一个简单的 HTML 示例页面。</p>
    <p>你可以在这里添加更多内容，比如图片、链接等。</p>
    <img src="https://via.placeholder.com/400x200" alt="示例图片">
    <p>点击 <a href="https://www.github.com" target="_blank">这里</a> 访问 GitHub。</p>
</body>
</html>
